apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-ingress-prod
  namespace: quiz-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Production SSL
    nginx.ingress.kubernetes.io/rate-limit: "100"  # Rate limiting
    nginx.ingress.kubernetes.io/ssl-redirect: "true"  # Force HTTPS
spec:
  rules:
  - host: quiz.your-domain.com  # Production domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3001
  tls:
  - hosts:
    - quiz.your-domain.com
    secretName: quiz-prod-tls
