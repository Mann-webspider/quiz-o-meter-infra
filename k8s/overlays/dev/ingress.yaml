apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-ingress-dev
  namespace: quiz-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-staging  # Use staging for dev
spec:
  rules:
  - host: quiz-dev.your-domain.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3001
  tls:
  - hosts:
    - quiz-dev.your-domain.com
    secretName: quiz-dev-tls
