apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: quiz-project
  namespace: argocd
spec:
  description: Quiz-O-Meter Application Project
  
  # Source repositories
  sourceRepos:
  - 'https://github.com/YOUR_USERNAME/quiz-o-meter-infra.git'  # Replace with your repo
  
  # Destination clusters and namespaces
  destinations:
  - namespace: 'quiz-dev'
    server: 'https://kubernetes.default.svc'
  - namespace: 'quiz-prod'
    server: 'https://kubernetes.default.svc'
  
  # Allowed cluster-scoped resources
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  
  # Allowed namespace-scoped resources
  namespaceResourceWhitelist:
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: StatefulSet
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  
  # Roles for project
  roles:
  - name: developer
    description: Developers can sync dev environment
    policies:
    - p, proj:quiz-project:developer, applications, sync, quiz-project/quiz-o-meter-dev, allow
    - p, proj:quiz-project:developer, applications, get, quiz-project/*, allow
  
  - name: admin
    description: Admins can manage all environments
    policies:
    - p, proj:quiz-project:admin, applications, *, quiz-project/*, allow
